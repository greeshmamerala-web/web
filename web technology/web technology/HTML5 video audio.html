<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>video and audio tags</title>
</head>
<body>
    <audio
    controls
    autoplay
    loop
    muted>
    <source src="audio.mp3" type="audio/mp4">
</audio><br>
<video
controls
autoplay
loop
muted
height="500"
width="500">
<source src="video.mp4" type='video/mp4'>
</video>
</body>
</html>
